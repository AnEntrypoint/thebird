<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>thebird web host sample</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <p class="eyebrow">thebird</p>
    <h1>Web host is ready</h1>
    <p id="subtitle">This static page is served by the local thebird web host.</p>
    <section aria-label="host details">
      <dl>
        <dt>Host</dt>
        <dd id="host-location">loading</dd>
        <dt>Server</dt>
        <dd id="server-state">checking</dd>
        <dt>Assets</dt>
        <dd id="asset-state">checking</dd>
      </dl>
    </section>
    <p class="note">HTML, CSS and JavaScript all loaded in a normal browser tab.</p>
    <a href="../">Back to the generated site</a>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
