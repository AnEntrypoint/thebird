name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Install zig 0.17.1
        run: |
          curl -fsSL -o "$RUNNER_TEMP/zig.tar.xz" https://ziglang.org/download/0.17.1/zig-x86_64-linux-0.17.1.tar.xz
          echo "3581863e3cbcfd0fce0efc682ce7e9e93da96668a977791d356a26d2a7e9b17a  $RUNNER_TEMP/zig.tar.xz" | sha256sum -c -
          sudo mkdir -p /workspace/tools
          sudo chown "$(id -u):$(id -g)" /workspace/tools
          tar -xJf "$RUNNER_TEMP/zig.tar.xz" -C /workspace/tools
      - name: Build tjs.wasm
        env:
          ZIG: /workspace/tools/zig-x86_64-linux-0.17.1/zig
          TMPDIR: /tmp
        run: node scripts/vendor-txiki.mjs
      - name: Check tjs.wasm against the pin
        run: echo "45df11a1cfe6dc3266a863702a3cef2b6a30e0a7071d40da6edb8926782787d1  web/vendor/txiki/tjs.wasm" | sha256sum -c -
      - run: node scripts/build-pages.mjs
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
