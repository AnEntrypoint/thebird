name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

env:
  GMFX_TOKEN: ${{ secrets.GMFX_TOKEN }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Check out private gmfx when a token is set
        if: env.GMFX_TOKEN != ''
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: AnEntrypoint/gmfx
          ref: main
          path: gmfx
          token: ${{ env.GMFX_TOKEN }}
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: AnEntrypoint/floosie
          ref: main
          path: floosie
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Install zig 0.17.1
        run: |
          curl -fsSL -o "$RUNNER_TEMP/zig.tar.xz" https://ziglang.org/download/0.17.1/zig-x86_64-linux-0.17.1.tar.xz
          echo "3581863e3cbcfd0fce0efc682ce7e9e93da96668a977791d356a26d2a7e9b17a  $RUNNER_TEMP/zig.tar.xz" | sha256sum -c -
          sudo mkdir -p /workspace/tools
          sudo chown "$(id -u):$(id -g)" /workspace/tools
          tar -xJf "$RUNNER_TEMP/zig.tar.xz" -C /workspace/tools
      - name: Build tjs.wasm
        env:
          ZIG: /workspace/tools/zig-x86_64-linux-0.17.1/zig
          TMPDIR: /tmp
        run: node scripts/vendor-txiki.mjs
      - name: Check tjs.wasm against the pin
        run: echo "$(node -p "JSON.parse(require('fs').readFileSync('scripts/txiki/pin.json', 'utf8')).tjsWasmSha256")  web/vendor/txiki/tjs.wasm" | sha256sum -c -
      - name: Rebuild fx from gmfx when a token is set
        if: env.GMFX_TOKEN != ''
        env:
          ZIG: /workspace/tools/zig-x86_64-linux-0.17.1/zig
          FX_REPO: ${{ github.workspace }}/gmfx
          FX_REBUILD: '1'
          TMPDIR: /tmp
        run: |
          node scripts/vendor-fx.mjs
          test -s web/vendor/fx/fx-core.wasm
          node -e "const m=require('./web/vendor/fx/manifest.json'); if (m.wasm.name !== 'fx-core.wasm' || !/^[0-9a-f]{64}$/.test(m.wasm.sha256)) process.exit(1)"
      - name: Check committed fx against its manifest
        run: node scripts/vendor-fx.mjs --verify
      - name: Build floosie browser bundle from latest floosie main
        env:
          FLOOSIE_REPO: ${{ github.workspace }}/floosie
        run: |
          cd "$FLOOSIE_REPO" && npm ci
          cd ${{ github.workspace }} && node scripts/vendor-floosie.mjs
          test -s web/vendor/floosie/browser.js
      - run: npm ci
      - run: node scripts/build-pages.mjs
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
